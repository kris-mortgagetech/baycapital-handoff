name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set SWA app settings
        run: |
          az staticwebapp appsettings set \
            --name agreeable-smoke-05f35950f \
            --resource-group rg-bcm-crm \
            --setting-names \
              AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              ELLI_SUBSCRIPTION_ID="${{ secrets.ELLI_SUBSCRIPTION_ID }}" \
              WEBHOOK_QUEUE_NAME="${{ secrets.WEBHOOK_QUEUE_NAME }}" \
              ENCOMPASS_BASE_URL="${{ secrets.ENCOMPASS_BASE_URL }}" \
              ENCOMPASS_USERNAME="${{ secrets.ENCOMPASS_USERNAME }}" \
              ENCOMPASS_PASSWORD="${{ secrets.ENCOMPASS_PASSWORD }}" \
              ENCOMPASS_CLIENT_ID="${{ secrets.ENCOMPASS_CLIENT_ID }}" \
              ENCOMPASS_CLIENT_SECRET="${{ secrets.ENCOMPASS_CLIENT_SECRET }}" \
              ENCOMPASS_INSTANCE_ID="${{ secrets.ENCOMPASS_INSTANCE_ID }}" \
              MONITOR_PASSWORD="${{ secrets.MONITOR_PASSWORD }}"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SMOKE_05F35950F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src"
          api_location: "api"
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_SMOKE_05F35950F }}
          action: "close"